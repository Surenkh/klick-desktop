name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    defaults:
      run:
        working-directory: clackle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run sounds
      - run: npm i -D electron-builder && npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: clackle-mac
          path: clackle/dist/*.dmg

  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clackle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run sounds
      - run: npm i -D electron-builder && npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: clackle-win
          path: clackle/dist/*.exe
