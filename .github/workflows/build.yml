name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native capture addon
        run: |
          set -euo pipefail
          NODE_INC="$(cd "$(dirname "$(command -v node)")/../include/node" && pwd)"
          clang -shared -fPIC -O2 -arch arm64 -arch x86_64 \
            -mmacosx-version-min=14.0 -I"$NODE_INC" -undefined dynamic_lookup \
            -framework ApplicationServices -framework CoreFoundation \
            -o native/klick-capture.node native/capture.c
          file native/klick-capture.node

      - name: Test
        run: npm test

      - name: Build installers (arm64 + x64)
        run: |
          npx electron-builder --mac dmg --arm64 --publish never
          npx electron-builder --mac dmg --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: klick-dmg
          path: dist/*.dmg
          if-no-files-found: error
