name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Native smoke tests (keymap, packs, mixer, cues)
        run: sh scripts/test-native.sh

      - name: Build both DMGs (arm64 + x86_64)
        run: sh scripts/package-native.sh

      - name: Verify architectures and size
        run: |
          set -eu
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' native/app/Info.plist)"
          for arch in arm64 x64; do
            mnt="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "dist/Klick-$VERSION-$arch.dmg" >/dev/null
            file "$mnt/Klick.app/Contents/MacOS/Klick"
            hdiutil detach "$mnt" >/dev/null
            rmdir "$mnt"
          done
          du -h dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: klick-native-dmg
          path: dist/*.dmg
          if-no-files-found: error
