<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Klick taps</title>
<style>
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    -webkit-user-select: none; cursor: grab;
    font-family: -apple-system, system-ui, sans-serif;
  }
  #pill {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 7px;
    border-radius: 14px; background: rgba(10, 16, 14, .9);
    border: 1px solid rgba(141, 234, 193, .6);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  #value {
    color: #fff; font-size: 17px; font-weight: 700; line-height: 1;
    letter-spacing: -.4px; font-variant-numeric: tabular-nums;
  }
  #label {
    color: rgba(141, 234, 193, .8); font-size: 8.5px; font-weight: 600;
    letter-spacing: .7px; text-transform: uppercase;
  }
  #pill.celebrate { animation: pop 420ms cubic-bezier(.2, .9, .3, 1.4); }
  @keyframes pop { 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
</style>
</head>
<body>
  <div id="pill"><span id="value">0</span><span id="label">taps</span></div>
  <script>
    (function () {
      const value = document.getElementById('value');
      const pill = document.getElementById('pill');
      let last = null;

      const paint = (taps) => {
        if (typeof taps !== 'number') return;
        value.textContent = taps.toLocaleString('en-US');
        if (window.klick && window.klick.debug) window.klick.debug(`counter-dom taps=${value.textContent}`);
        if (last !== null && taps > last) {
          pill.classList.remove('celebrate');
          void pill.offsetWidth;
          pill.classList.add('celebrate');
        }
        last = taps;
      };

      window.__klickEvent = (name, payload) => {
        if (name === 'stats' && payload) paint(payload.taps);
        if (name === 'press' && payload) {
          paint(payload.taps);
        }
      };

      // dragging moves this window on its own
      let dragging = false, moved = 0, lastX = 0, lastY = 0;
      document.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        dragging = true; moved = 0; lastX = e.screenX; lastY = e.screenY;
        document.body.setPointerCapture(e.pointerId);
      });
      document.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.screenX - lastX, dy = e.screenY - lastY;
        if (!dx && !dy) return;
        moved += Math.abs(dx) + Math.abs(dy);
        lastX = e.screenX; lastY = e.screenY;
        window.klick.counterMove(dx, dy);
      });
      const end = (e) => {
        if (!dragging) return;
        dragging = false;
        try { document.body.releasePointerCapture(e.pointerId); } catch (_) {}
        if (moved >= 3) window.klick.counterEnd();
      };
      document.addEventListener('pointerup', end);
      document.addEventListener('pointercancel', end);

      if (window.klick && window.klick.getSettings) {
        window.klick.getSettings().then((s) => {
          if (s && typeof s.taps === 'number') paint(s.taps);
        }).catch(() => {});
      }
    })();
  </script>
</body>
</html>
