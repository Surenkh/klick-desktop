<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kiki</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%; background: transparent; overflow: hidden;
        -webkit-user-select: none; cursor: default;
      }
      #tapPill {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        z-index: 3; flex: 0 0 auto;
        display: inline-flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 7px; padding: 8px 13px 8px;
        border-radius: 14px; white-space: nowrap; pointer-events: none;
        background: rgba(10, 16, 14, .9);
        border: 1px solid rgba(141, 234, 193, .6);
        box-shadow: 0 6px 18px rgba(0, 0, 0, .45), 0 0 0 1px rgba(0, 0, 0, .35) inset;
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      }
      #tapPill .value {
        color: #fff; font: 700 17px/1 -apple-system, system-ui, sans-serif;
        letter-spacing: -.4px; font-variant-numeric: tabular-nums;
      }
      #tapPill .label {
        color: rgba(141, 234, 193, .8);
        font: 600 8.5px/1 -apple-system, system-ui, sans-serif;
        letter-spacing: .7px; text-transform: uppercase;
      }
      #burst {
        position: absolute; left: -4%; top: -8%; width: 66%; height: 116%;
        object-fit: contain; opacity: 0; pointer-events: none; z-index: 1;
        transition: opacity 140ms ease;
      }
      #burst.show { opacity: 1; animation: burst 1.1s ease-out; }
      @keyframes burst {
        0% { transform: scale(.72) rotate(-6deg); }
        55% { transform: scale(1.06) rotate(3deg); }
        100% { transform: scale(1) rotate(0deg); }
      }
      #tapPill[hidden] { display: none; }
      #celebrate { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
      .confetti {
        position: absolute; width: 6px; height: 6px; border-radius: 2px;
        left: 50%; top: 54%; animation: fall 950ms cubic-bezier(.2, .7, .3, 1) forwards;
      }
      @keyframes fall {
        to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
      }
      #toast {
        position: absolute; left: 50%; top: 2px; transform: translateX(-50%) scale(.92);
        padding: 4px 10px; border-radius: 999px; white-space: nowrap;
        background: linear-gradient(180deg, #ffd479, #ffb84d); color: #241a08;
        font: 700 10.5px/1.3 -apple-system, system-ui, sans-serif;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .35); opacity: 0;
        transition: opacity 180ms ease, transform 220ms cubic-bezier(.2, .9, .3, 1.3);
      }
      #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

      #stage {
        position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; padding: 8px;
        -webkit-app-region: drag; overflow: hidden;
      }

      /* #float does the weightless drift, #char does the press/pop squash, so
         the two never fight over the same transform */
      #float {
        width: 97px; height: 97px;
        transform-origin: 50% 62%;
        animation: drift 13s cubic-bezier(.45, .05, .55, .95) infinite;
        will-change: transform;
      }
      #float { transition: opacity 130ms ease; }
      #stage.celebrating #float { opacity: 0; }
      #char {
        position: relative; width: 100%; height: 100%;
        transform-origin: 50% 78%;
        transition: transform 130ms cubic-bezier(.22, .8, .3, 1);
        will-change: transform;
      }
      .klick {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; pointer-events: none; opacity: 0;
        transition: opacity 220ms ease;
        filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .40));
      }
      .klick.show { opacity: 1; }

      #char.press { transform: translateY(3px) scale(.955); }
      #char.pop    { animation: pop 380ms cubic-bezier(.22, .9, .3, 1.25); }
      #char.enter  { animation: enter 420ms cubic-bezier(.22, .9, .3, 1.2); }
      /* no gravity: a slow, slightly irregular hover rather than a bob */
      @keyframes drift {
        0%   { transform: translate3d(0, 0, 0) rotate(-0.5deg); }
        18%  { transform: translate3d(2.5px, -4px, 0) rotate(0.6deg); }
        37%  { transform: translate3d(-1px, -7px, 0) rotate(-0.3deg); }
        55%  { transform: translate3d(-4px, -4.5px, 0) rotate(-0.9deg); }
        74%  { transform: translate3d(-2px, -1.5px, 0) rotate(0.5deg); }
        88%  { transform: translate3d(1.5px, -2.5px, 0) rotate(0.2deg); }
        100% { transform: translate3d(0, 0, 0) rotate(-0.5deg); }
      }
      @keyframes pop {
        0%   { transform: scale(1); }
        45%  { transform: scale(1.05) translateY(-2px); }
        100% { transform: scale(1); }
      }
      @keyframes enter {
        0%   { transform: scale(.92) translateY(6px); opacity: 0; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }

      /* drawn fallback if the art is missing */
      .cap {
        width: 104px; height: 104px; border-radius: 26px; display: none;
        background:
          radial-gradient(120% 90% at 30% 8%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 42%),
          linear-gradient(160deg, #6f63a8 0%, #4a4372 55%, #2b2740 100%);
        box-shadow: 0 16px 28px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.16),
                    inset 0 -7px 14px rgba(0,0,0,.5);
        position: relative; place-items: center;
      }
      .cap::after {
        content: ""; position: absolute; inset: 7px; border-radius: 20px;
        background: #16161c;
        box-shadow: inset 0 0 0 2px rgba(120, 240, 190, .5), inset 0 8px 22px rgba(0,0,0,.8);
      }
      .face { position: relative; width: 58px; height: 44px; z-index: 1; }
      .eye {
        position: absolute; top: 6px; width: 9px; height: 12px; border-radius: 50%;
        background: #f7ecc8; box-shadow: 0 0 8px rgba(255, 226, 150, .9);
      }
      .eye.left { left: 8px; } .eye.right { right: 8px; }
      .mouth {
        position: absolute; left: 50%; bottom: 2px; width: 18px; height: 9px;
        transform: translateX(-50%); border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px; border: 2.5px solid #f7ecc8; border-top: 0;
      }

      /* settings affordance */

      @media (prefers-reduced-motion: reduce) {
        #float { animation: none; }
        #char.pop, #char.enter { animation: none; }
        #char, .klick { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="celebrate"></div>
      <div id="toast"></div>
      <img id="burst" src="../../assets/buddy/celebrate.png" alt="" />
      <div id="float">
        <div id="char" hidden>
          <img class="klick" id="k0" alt="Kiki" />
          <img class="klick" id="k1" alt="" />
        </div>
      </div>
      <div class="cap" id="cap">
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>
    <script>
      const api = window.klick || {
        onPress() {}, onMood() {}, hat: async () => null, openSettings() {}, quit() {}
      };
      const BASE = '../../assets/buddy/';
      const char = document.getElementById('char');
      const layers = [document.getElementById('k0'), document.getElementById('k1')];
      let front = 0;
      let shownSrc = '';
      const cap = document.getElementById('cap');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const PNG = ['idle', 'press', 'happy', 'party', 'sweat', 'error', 'sleep', 'blink'];
      const art = {};   // state -> url
      const anim = {};  // 'idle' | 'happy' -> url
      let ready = false;
      let mode = 'idle';
      let timer = null;
      let blinkTimer = null;
      let sleepTimer = null;
      let pressTimer = null;
      let lastActivity = Date.now();

      // ---------- load ----------
      let pending = PNG.length + 2;
      const settle = () => { if (--pending === 0) boot(); };

      for (const state of PNG) {
        const img = new Image();
        img.onload = () => { art[state] = img.src; settle(); };
        img.onerror = settle;
        img.src = BASE + state + '.png';
      }
      for (const name of ['idle', 'happy']) {
        const img = new Image();
        img.onload = () => { anim[name] = img.src; settle(); };
        img.onerror = settle;
        img.src = BASE + 'anim/' + name + '.webp';
      }

      function boot() {
        if (!art.idle) {
          // no art installed: keep the drawn keycap but still react
          cap.style.display = 'grid';
          char.hidden = true;
          return;
        }
        ready = true;
        cap.style.display = 'none';
        char.hidden = false;
        char.classList.add('enter');
        setTimeout(() => char.classList.remove('enter'), 440);
        show('idle');
        scheduleBlink();
        armSleep();
        const pinned = new URLSearchParams(location.hash.slice(1)).get('state');
        if (pinned && art[pinned]) { mode = pinned; show(pinned); }
      }

      // ---------- rendering ----------
      function show(state) {
        if (!ready) return;
        const useAnim = (state === 'idle' && anim.idle) || (state === 'happy' && anim.happy);
        const src = useAnim ? (state === 'happy' ? anim.happy : anim.idle) : (art[state] || art.idle);
        if (!src) return;

        if (src !== shownSrc) {
          const back = layers[1 - front];
          const current = layers[front];
          let swapped = false;
          const swap = () => {
            // onload, the cached check and the safety net can all fire; only the
            // first one may move the front, or both layers end up hidden
            if (swapped || !back.naturalWidth) return;
            swapped = true;
            back.classList.add('show');
            current.classList.remove('show');
            front = 1 - front;
            shownSrc = src;
            console.log('[klick] show', state, src.split('/').pop());
          };
          back.onload = swap;
          back.src = src;
          if (back.complete && back.naturalWidth) swap();
          setTimeout(swap, 250);
        }

      }

      function toIdle(pop) {
        mode = 'idle';
        show('idle');
        if (pop && !reduceMotion) {
          char.classList.add('pop');
          setTimeout(() => char.classList.remove('pop'), 400);
        }
        scheduleBlink();
        armSleep();
      }

      function setMood(next, ms) {
        mode = next;
        show(next);
        if (timer) clearTimeout(timer);
        if (ms) timer = setTimeout(() => toIdle(true), ms);
      }

      // ---------- interaction ----------
      api.onPress(() => {
        lastActivity = Date.now();
        if (!ready) return;
        if (mode === 'sleep') return toIdle(true);
        const restore = mode === 'press' ? 'idle' : mode;
        mode = 'press';
        show('press');
        char.classList.add('press');
        if (pressTimer) clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          char.classList.remove('press');
          if (mode === 'press') { mode = restore; show(restore); }
        }, 110);
        armSleep();
        scheduleBlink();
      });

      api.onMood((raw) => {
        lastActivity = Date.now();
        if (!ready) return;
        const map = {
          party: ['party', 1800], success: ['party', 1800],
          happy: ['happy', 1400],
          sweat: ['sweat', 2600], attention: ['sweat', 2600], 'needs-you': ['sweat', 2600],
          error: ['error', 2000], loud: ['error', 2000]
        };
        const hit = map[raw];
        if (!hit) return;
        setMood(hit[0], hit[1]);
      });

      // ---------- idle behaviours ----------
      function scheduleBlink() {
        if (blinkTimer) clearTimeout(blinkTimer);
        if (reduceMotion || anim.idle) return; // the animated loop blinks by itself
        blinkTimer = setTimeout(() => {
          if (mode === 'idle' && art.blink) {
            show('blink');
            setTimeout(() => { if (mode === 'idle') show('idle'); }, 120);
          }
          scheduleBlink();
        }, 3800 + Math.random() * 3600);
      }

      function armSleep() {
        if (sleepTimer) clearTimeout(sleepTimer);
        sleepTimer = setTimeout(() => {
          if (mode === 'idle' && Date.now() - lastActivity > 88000) {
            mode = 'sleep';
            show('sleep');
          }
        }, 90000);
      }

      // ---------- shell ----------
      window.addEventListener('beforeunload', () => {
        clearTimeout(timer); clearTimeout(blinkTimer);
        clearTimeout(sleepTimer); clearTimeout(pressTimer);
      });
    </script>
  
  <script>
  // live tap pill + milestone celebration
  (function () {
    const pill = document.getElementById('tapPill');
    const count = document.getElementById('tapCount');
    const celebrate = document.getElementById('celebrate');
    const toast = document.getElementById('toast');
    const api = window.klick || {};

    const setCount = (value) => {
      if (typeof value === 'number') count.textContent = value.toLocaleString('en-US');
    };

    const burst = document.getElementById('burst');
    const stage = document.getElementById('stage');
    const party = (milestone) => {
      if (stage) {
        stage.classList.add('celebrating');
        setTimeout(() => stage.classList.remove('celebrating'), 1150);
      }
      if (burst) {
        burst.classList.remove('show');
        void burst.offsetWidth;
        burst.classList.add('show');
        setTimeout(() => burst.classList.remove('show'), 1150);
      }
      // confetti burst
      const colors = ['#ffb84d', '#8be0a4', '#7fd1ff', '#ff9ad5', '#ffe066'];
      for (let i = 0; i < 26; i++) {
        const piece = document.createElement('i');
        piece.className = 'confetti';
        const angle = (-Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 1.2;
        const distance = 40 + Math.random() * 70;
        piece.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
        piece.style.setProperty('--dy', `${Math.sin(angle) * distance + 40}px`);
        piece.style.setProperty('--rot', `${Math.random() * 540 - 270}deg`);
        piece.style.background = colors[i % colors.length];
        piece.style.left = `${45 + Math.random() * 10}%`;
        celebrate.appendChild(piece);
        setTimeout(() => piece.remove(), 1000);
      }
      toast.textContent = `🎉 ${milestone.toLocaleString('en-US')} taps!`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    };

    if (api.onPress) {
      api.onPress((payload) => {
        if (!payload) return;
        setCount(payload.taps);
        if (api.debug) api.debug(`buddy-pill taps=${count.textContent}`);
        if (payload.milestone) party(payload.milestone);
      });
    }
    if (api.onStats) api.onStats((stats) => {
      setCount(stats && stats.taps);
      if (api.debug && window.__lastPill !== count.textContent) {
        window.__lastPill = count.textContent;
        api.debug(`buddy-stats taps=${count.textContent}`);
      }
    });
    if (api.onSettings) {
      api.onSettings((settings) => {
        pill.hidden = settings && settings.showTapCounter === false;
      });
    }
    if (api.getSettings) {
      api.getSettings().then((settings) => {
        if (!settings) return;
        pill.hidden = settings.showTapCounter === false;
        if (typeof settings.taps === 'number') setCount(settings.taps);
      }).catch(() => {});
    }
  })();
  </script>
  <script>
  // klick-drag: drag to move the panel, tap to slap (+10 XP)
  (function () {
    const host = document.getElementById('float') || document.body;
    let dragging = false, moved = 0, lastX = 0, lastY = 0;
    host.style.cursor = 'grab';
    host.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      dragging = true; moved = 0; lastX = e.screenX; lastY = e.screenY;
      try { host.setPointerCapture(e.pointerId); } catch (_) {}
      host.style.cursor = 'grabbing';
    });
    host.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.screenX - lastX, dy = e.screenY - lastY;
      if (!dx && !dy) return;
      moved += Math.abs(dx) + Math.abs(dy);
      lastX = e.screenX; lastY = e.screenY;
      if (window.klick && window.klick.buddyMove) window.klick.buddyMove(dx, dy);
    });
    const end = (e) => {
      if (!dragging) return;
      dragging = false;
      host.style.cursor = 'grab';
      try { host.releasePointerCapture(e.pointerId); } catch (_) {}
      if (moved < 6) {
        if (window.klick && window.klick.slap) window.klick.slap();
      } else if (window.klick && window.klick.buddyEnd) {
        window.klick.buddyEnd();
      }
    };
    host.addEventListener('pointerup', end);
    host.addEventListener('pointercancel', end);
  })();
  </script>
</body>
</html>
